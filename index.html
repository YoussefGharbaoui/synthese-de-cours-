    <script>
      // Fix for browser extensions attempting to assign window.fetch when it only has a getter
      (function() {
        try {
          const originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          let currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (_) {}

        // Prevent external extension errors from breaking page scripts
        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.startsWith('chrome-extension://')) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
